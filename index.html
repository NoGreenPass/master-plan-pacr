<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Master plan PACR</title>
<meta name="description" content="Pianificatore di studio: coda di attività, settimana tipo e calendario.">
<meta name="theme-color" content="#F1F4F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1322" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PACR">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Barlow"; src: url(barlow-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Barlow"; src: url(barlow-latin-500-normal.woff2) format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Barlow"; src: url(barlow-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Barlow"; src: url(barlow-latin-700-normal.woff2) format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url(barlow-condensed-latin-500-normal.woff2) format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url(barlow-condensed-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url(barlow-condensed-latin-700-normal.woff2) format("woff2"); font-weight: 700; font-display: swap; }
:root {
  color-scheme: light;
  --paper: #F1F4F9;
  --surface: #FFFFFF;
  --surface-2: #E9EEF5;
  --ink: #13213C;
  --ink-2: #46567A;
  --ink-3: #75839E;
  --line: #E0E6EF;
  --line-2: #C3CEDF;
  --accent: #2346D8;
  --accent-ink: #FFFFFF;
  --now: #E5322D;
  --ok: #1C8A4C;
  --warn: #A86400;
  --danger: #C62F2F;
  --shadow: 0 1px 2px rgba(19, 33, 60, .06), 0 10px 28px rgba(19, 33, 60, .10);
  --font: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-c: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --topbar-h: 58px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0C1322; --surface: #141D30; --surface-2: #1B263D;
    --ink: #E6ECF7; --ink-2: #A9B6CD; --ink-3: #75849F;
    --line: #1F2A41; --line-2: #31405E;
    --accent: #86A2FF; --accent-ink: #0C1322;
    --now: #FF5B53; --ok: #52C483; --warn: #F0A73A; --danger: #FF6B6B;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 12px 32px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0C1322; --surface: #141D30; --surface-2: #1B263D;
  --ink: #E6ECF7; --ink-2: #A9B6CD; --ink-3: #75849F;
  --line: #1F2A41; --line-2: #31405E;
  --accent: #86A2FF; --accent-ink: #0C1322;
  --now: #FF5B53; --ok: #52C483; --warn: #F0A73A; --danger: #FF6B6B;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 12px 32px rgba(0, 0, 0, .4);
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { background: var(--paper); }
body {
  margin: 0; color: var(--ink);
  font: 400 15px/1.45 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-c); line-height: 1.1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- barra superiore ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--paper) 90%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line-2);
}
.topbar-in { max-width: 1480px; margin: 0 auto; display: flex; align-items: center; gap: 18px; padding: 10px 20px; }
.brand { font: 700 22px/1 var(--font-c); white-space: nowrap; display: flex; align-items: baseline; gap: 8px; }
.brand .grid-mark { width: 18px; height: 18px; border: 1.5px solid var(--accent); border-radius: 3px; align-self: center;
  background-image: linear-gradient(var(--accent) 1px, transparent 1px), linear-gradient(90deg, var(--accent) 1px, transparent 1px);
  background-size: 6px 6px; background-position: -1px -1px; opacity: .85; }
.tabs { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; border: 0; background: none; font: 600 15px var(--font); color: var(--ink-2);
  padding: 8px 12px; border-radius: 6px; cursor: pointer; position: relative; white-space: nowrap; }
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 1px; height: 2px; background: var(--accent); border-radius: 2px; }
.count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px;
  font: 700 11px/1 var(--font); background: var(--now); color: #fff; vertical-align: 1px; }
.undo-btn { flex: none; }
main { max-width: 1480px; margin: 0 auto; padding: 18px 20px 96px; }

/* ---------- bottoni e campi ---------- */
.btn { appearance: none; display: inline-flex; align-items: center; gap: 6px; font: 600 14px/1.2 var(--font);
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 8px 12px; cursor: pointer; text-align: left; }
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 5px 9px; font-size: 13px; }
.icon-btn { appearance: none; width: 32px; height: 32px; display: inline-grid; place-items: center; flex: none;
  border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--ink-2); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.ok:hover { color: var(--ok); }
.icon-btn.no:hover { color: var(--danger); }
.icon-btn:disabled { opacity: .3; cursor: default; background: none; }
input, select, textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2);
  border-radius: 6px; padding: 7px 9px; min-width: 0; width: 100%; }
textarea { resize: vertical; min-height: 64px; }
input[type="checkbox"], input[type="radio"] { width: auto; accent-color: var(--accent); }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 0; border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.seg button { appearance: none; border: 0; background: var(--surface); padding: 6px 10px; font: 600 13px var(--font); color: var(--ink-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* ---------- vista Piano ---------- */
.piano { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 22px; align-items: start; }
.week-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin: 2px 0 14px; }
.week-title { margin: 0; font: 700 38px/0.95 var(--font-c); letter-spacing: -.01em; }
.week-title .yr { color: var(--ink-3); font-weight: 500; }
.week-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.summary { margin: 8px 0 0; color: var(--ink-2); max-width: 72ch; font-size: 15px; }
.summary b { color: var(--ink); font-weight: 600; }
.summary .warn { color: var(--warn); font-weight: 600; }

.intro { display: flex; gap: 20px; align-items: flex-start; justify-content: space-between; margin: 0 0 18px; padding: 16px 18px;
  background: var(--surface); border: 1px solid var(--line-2); border-left: 4px solid var(--accent); border-radius: 8px; }
.intro h2 { margin: 0 0 6px; font-size: 22px; }
.intro > .btn, .week-nav .btn, .toolbar .btn { flex: none; white-space: nowrap; }
.intro p { margin: 0 0 6px; color: var(--ink-2); max-width: 75ch; }
.intro ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); max-width: 78ch; }
.intro li { margin: 3px 0; }
.intro li b { color: var(--ink); }

.daystrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 0 0 10px; }
.daychip { appearance: none; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 6px 2px 5px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--ink-2); }
.daychip b { font: 700 20px/1 var(--font-c); color: var(--ink); }
.daychip small { font-size: 11px; }
.daychip.today b { color: var(--accent); }
.daychip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.daychip[aria-pressed="true"] b { color: var(--paper); }

.cal { background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; }
.cal-head, .cal-body { display: grid; grid-template-columns: 54px repeat(var(--cols), minmax(0, 1fr)); }
.cal-head { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--topbar-h)); z-index: 6; background: var(--surface);
  border-bottom: 1px solid var(--line-2); border-radius: 10px 10px 0 0; }
.dh { padding: 8px 8px 7px; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.dh.corner { border-left: 0; }
.dh .dn { font: 600 13px/1.1 var(--font); color: var(--ink-3); }
.dh .dd { font: 700 26px/1 var(--font-c); margin-top: 2px; }
.dh .dm { font: 500 12px/1.2 var(--font); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.dh.today { box-shadow: inset 0 -3px 0 var(--accent); }
.dh.today .dd, .dh.today .dn { color: var(--accent); }
.cal-body { position: relative; border-radius: 0 0 10px 10px; overflow: hidden; }
.cal-times { position: relative; border-right: 1px solid var(--line-2); }
.cal-times span { position: absolute; right: 7px; margin-top: 3px; font: 600 12px/1 var(--font-c); color: var(--ink-3); letter-spacing: .02em; }
.cal-col { position: relative; border-left: 1px solid var(--line); cursor: cell;
  background-image: linear-gradient(to bottom, var(--line-2) 1px, transparent 1px), linear-gradient(to bottom, var(--line) 1px, transparent 1px);
  background-size: 100% calc(60px * var(--ppm)), 100% calc(30px * var(--ppm)); }
.cal-times + .cal-col { border-left: 0; }
.closed { position: absolute; left: 0; right: 0; pointer-events: none;
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--ink) 9%, transparent) 0 1.5px, transparent 1.5px 8px), color-mix(in srgb, var(--paper) 70%, transparent); }
.past { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; background: color-mix(in srgb, var(--ink) 4.5%, transparent); }
.nowline { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--now); z-index: 5; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }

.blk, .itm { position: absolute; border-radius: 4px; overflow: hidden; padding: 2px 6px; font: 500 12.5px/14px var(--font-c); cursor: pointer; }
.blk { z-index: 1; --c: #7C88A2;
  background: color-mix(in srgb, var(--c) 24%, var(--surface));
  color: color-mix(in srgb, var(--c) 40%, var(--ink));
  border: 1px solid color-mix(in srgb, var(--c) 38%, transparent); }
.blk .bl, .itm .l1, .itm .l2 { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .bt { display: block; font-size: 11.5px; opacity: .8; }
.blk.tp-libero { background: color-mix(in srgb, var(--c) 11%, var(--surface)); border-color: transparent; color: color-mix(in srgb, var(--c) 50%, var(--ink-3)); }
.blk.tp-saltato { color: var(--danger); border-color: color-mix(in srgb, var(--c) 45%, transparent);
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 20%, var(--surface)) 0 5px, color-mix(in srgb, var(--c) 8%, var(--surface)) 5px 10px); }
.blk.exc { border-style: dashed; }
.blk:hover { filter: brightness(.97); }
.itm { z-index: 2; color: var(--ink); padding-left: 7px;
  background: color-mix(in srgb, var(--c) 18%, var(--surface));
  border-left: 4px solid var(--c);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 22%, transparent); }
.itm .s { color: color-mix(in srgb, var(--c) 72%, var(--ink)); font-weight: 700; }
.itm .l1 { font-weight: 600; }
.itm .l2 { color: var(--ink-2); }
.itm:hover { background: color-mix(in srgb, var(--c) 26%, var(--surface)); }
.itm .mk { position: absolute; right: 3px; top: 2px; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 50%;
  font: 700 11px/1 var(--font); font-style: normal; background: var(--surface); color: color-mix(in srgb, var(--c) 75%, var(--ink)); }
.itm .mk + .l1, .itm.has-mk .l1 { padding-right: 16px; }
.itm.pending { outline: 1.5px dashed color-mix(in srgb, var(--c) 80%, transparent); outline-offset: -1.5px; box-shadow: none; }
.itm.done { background: color-mix(in srgb, var(--c) 8%, var(--surface)); border-left-color: color-mix(in srgb, var(--c) 50%, var(--surface)); color: var(--ink-2); box-shadow: none; }
.itm.done .l2 { color: var(--ink-3); }
.itm.done .mk { background: var(--ok); color: #fff; }
.itm.skipped { border-left-color: var(--danger); color: var(--ink-3); box-shadow: none;
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--danger) 10%, var(--surface)) 0 5px, var(--surface) 5px 10px); }
.itm.skipped .l1, .itm.skipped .l2 { text-decoration: line-through; color: var(--ink-3); }
.itm.skipped .mk { background: var(--danger); color: #fff; }
.itm.running { box-shadow: 0 0 0 2px var(--c); }
.itm.running .mk { background: var(--c); }
.itm.running .mk::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 2px 0; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: color-mix(in srgb, var(--c) 30%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); }
.legend .tip { flex-basis: 100%; color: var(--ink-3); }

/* ---------- colonna laterale ---------- */
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--topbar-h) + 16px);
  max-height: calc(100dvh - var(--topbar-h) - 32px - env(safe-area-inset-top, 0px)); overflow: auto;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; }
.rail section { padding: 15px 16px 14px; }
.rail section + section { border-top: 1px solid var(--line); }
.rail h2 { margin: 0 0 8px; font-size: 20px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.rail h2 small { font: 500 13px var(--font); color: var(--ink-3); }
.alist { list-style: none; margin: 0; padding: 0; }
.alist li { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 0; min-height: 34px; }
.alist li + li { border-top: 1px dashed var(--line); }
.alist .tm { font: 600 13px/1.25 var(--font-c); color: var(--ink-3); white-space: nowrap; }
.alist li.past { opacity: .55; }
.alist .lb { min-width: 0; font-size: 14px; line-height: 1.25; }
.alist .lb b { font-weight: 600; }
.alist .lb small { display: block; color: var(--ink-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alist .lb .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: 1px; }
.alist li.fixed .lb { color: var(--ink-3); }
.alist li.is-item { cursor: pointer; }
.alist li.is-item:hover .lb b { text-decoration: underline; text-decoration-color: var(--line-2); }
.alist .acts { display: flex; gap: 2px; }
.alist .stx { font-size: 12px; font-weight: 600; }
.stx.done { color: var(--ok); } .stx.skipped { color: var(--danger); } .stx.running { color: var(--accent); }
.bulk { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.proj { list-style: none; margin: 0; padding: 0; }
.proj li { padding: 7px 0 7px 12px; border-left: 3px solid var(--c); margin: 0 0 8px; }
.proj li b { display: block; font-weight: 600; }
.proj li span { color: var(--ink-2); font-size: 14px; }
.proj li .late { color: var(--danger); font-weight: 600; }
.proj li .okm { color: var(--ok); }
.empty { color: var(--ink-3); margin: 0; font-size: 14px; }

/* ---------- pagine interne ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; margin: 2px 0 16px; }
.page-head h1 { margin: 0; font-size: 38px; letter-spacing: -.01em; }
.page-head p { margin: 6px 0 0; color: var(--ink-2); max-width: 75ch; }
.subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin: 0 0 18px; }
.subj { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: start; padding: 11px 12px 11px 14px; background: var(--surface);
  border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 6px; }
.subj h3 { margin: 0; font-size: 19px; }
.subj p { margin: 0; grid-column: 1 / -1; color: var(--ink-2); font-size: 14px; }
.subj p .late { color: var(--danger); font-weight: 600; }
.subj.add { border: 1px dashed var(--line-2); border-top-width: 1px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--ink-2); cursor: pointer; background: transparent; min-height: 84px; font-weight: 600; }
.subj.add:hover { color: var(--ink); border-color: var(--ink-3); }

.quick { display: grid; grid-template-columns: 190px 170px minmax(0, 1fr) 110px auto; gap: 8px; align-items: center; padding: 12px;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; margin: 0 0 12px; }
.quick .dur { display: flex; align-items: center; gap: 6px; }
.quick .dur span { color: var(--ink-3); font-size: 14px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 10px; }
.toolbar .spacer { flex: 1; }
.toolbar select { width: auto; }
.queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.q-row { display: grid; grid-template-columns: 26px 26px 120px minmax(0, 1fr) 92px 200px 118px auto; gap: 10px; align-items: center;
  padding: 7px 8px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 6px; position: relative; }
.q-row.dragging { z-index: 10; box-shadow: var(--shadow); border-color: var(--line-2); }
.queue.is-dragging .q-row:not(.dragging) { transition: transform .15s ease; }
.q-grip { appearance: none; border: 0; background: none; width: 26px; height: 30px; display: grid; place-items: center; color: var(--ink-3); cursor: grab; touch-action: none; border-radius: 4px; }
.q-grip:hover { color: var(--ink); background: var(--surface-2); }
.q-n { font: 700 16px var(--font-c); color: var(--ink-3); text-align: right; }
.q-subj { font: 700 14px/1.2 var(--font-c); color: color-mix(in srgb, var(--c) 72%, var(--ink)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-main { min-width: 0; line-height: 1.3; }
.q-main b { font-weight: 600; }
.q-main .ct { color: var(--ink-2); }

  <section id="view-piano" aria-label="Piano"></section>
  <section id="view-coda" aria-label="Coda" hidden></section>

<div class="toast-wrap"><div class="toast" id="toast" role="status" aria-live="polite"></div></div>
<script>
(function () {
'use strict';
// ===================== MOTORE DI PIANIFICAZIONE =====================
// Modello:
//  - state.frozen  = passato congelato: blocchi già trascorsi (planned/done/skipped)
//  - state.cursor  = istante fino al quale il passato è congelato
//  - il piano futuro si calcola SEMPRE da cursor in avanti, riempiendo il tempo
//    libero della settimana tipo (meno eccezioni) con la coda, in ordine.
// Garanzia: se non cambia nulla, congelare in un qualsiasi istante non sposta il piano.

const MIN = 60000;
const MAX_DAYS = 400;
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const tsOf = (s, min) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 0, min).getTime(); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const weekday = s => (parseD(s).getDay() + 6) % 7; // 0 = lunedì
const mondayOf = s => addDays(s, -weekday(s));
const minOfDay = ts => { const d = new Date(ts); return d.getHours() * 60 + d.getMinutes(); };
const minWithin = (ts, s) => (ts >= tsOf(addDays(s, 1), 0) ? 1440 : ts <= tsOf(s, 0) ? 0 : minOfDay(ts));
const floorMin = ts => Math.floor(ts / MIN) * MIN;
const fmtHM = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const parseHM = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; };

let _uidN = 0;
const uid = p => `${p}_${Date.now().toString(36)}${(_uidN++).toString(36)}${Math.random().toString(36).slice(2, 6)}`;

function dayLayout(st, ds) {
  const tpl = st.template[weekday(ds)] || { start: 480, end: 1320, blocks: [] };
  const cancelled = new Set();
  for (const c of st.cancels) if (c.date === ds) cancelled.add(c.blockId);
  const blocks = [];
  for (const b of tpl.blocks) if (!cancelled.has(b.id)) blocks.push({ ...b, src: 'tpl', date: ds });
  for (const e of st.exceptions) if (e.date === ds) blocks.push({ ...e, src: 'exc' });
  blocks.sort((a, b) => a.start - b.start || a.end - b.end);
  return { date: ds, start: tpl.start, end: tpl.end, blocks };
}

function freeOf(L) {
  let segs = [[L.start, L.end]];
  for (const b of L.blocks) {
    const out = [];
    for (const [a, c] of segs) {
      if (b.end <= a || b.start >= c) { out.push([a, c]); continue; }
      if (b.start > a) out.push([a, b.start]);
      if (b.end < c) out.push([b.end, c]);
    }
    segs = out;
  }
  return segs.filter(([a, c]) => c > a);
}

function usedMinutes(st) {
  const m = new Map();
  for (const f of st.frozen) {
    if (f.st === 'skipped') continue;
    m.set(f.taskId, (m.get(f.taskId) || 0) + (f.end - f.start) / MIN);
  }
  return m;
}

function remainingOf(t, used) {
  if (t.status !== 'todo') return 0;
  return Math.max(0, Math.round((+t.duration || 0) - (used.get(t.id) || 0)));
}

function contTask(st) {
  if (st.cursor == null) return null;
  for (const f of st.frozen) if (f.end === st.cursor && f.st === 'planned') return f.taskId;
  return null;
}

// Riempimento greedy in ordine di coda, rispettando "non prima di" e il blocco minimo.
function computePlan(st, fromTs, opts = {}) {
  const stopAt = opts.stopAt ?? Infinity;
  const cont = opts.cont ?? null;
  const minChunk = Math.max(5, +st.settings.minChunk || 30);
  const used = usedMinutes(st);
  const queue = [];
  for (const t of st.tasks) {
    const r = remainingOf(t, used);
    if (r > 0) queue.push({ id: t.id, rem: r, rel: t.notBefore ? tsOf(t.notBefore, 0) : -Infinity });
  }
  const segs = [];
  if (!queue.length) return { segs, left: [], end: null };
  let ds = dstr(new Date(fromTs));
  let first = true;
  let pending = queue.length;
  outer:
  for (let n = 0; n < MAX_DAYS; n++, ds = addDays(ds, 1)) {
    if (tsOf(ds, 0) >= stopAt) break;
    for (const [fa, fb] of freeOf(dayLayout(st, ds))) {
      const ib = tsOf(ds, fb);
      if (ib <= fromTs) continue;
      let t = Math.max(tsOf(ds, fa), fromTs);
      while (t < ib) {
        if (t >= stopAt) break outer;
        let idx = -1, nextRel = Infinity;
        for (let i = 0; i < queue.length; i++) {
          const q = queue[i];
          if (q.rem <= 0) continue;
          if (q.rel <= t) { idx = i; break; }
          if (q.rel < nextRel) nextRel = q.rel;
        }
        if (idx < 0) { if (nextRel < ib) { t = nextRel; continue; } break; }
        const q = queue[idx];
        const limit = Math.min(ib, nextRel);
        const avail = Math.floor((limit - t) / MIN);
        const isCont = first && t === fromTs && q.id === cont;
        first = false;
        if (!isCont && avail < minChunk && q.rem > avail) {
          if (nextRel < ib) { t = nextRel; continue; }
          break;
        }
        if (avail <= 0) break;
        const alloc = Math.min(q.rem, avail);
        const e = t + alloc * MIN;
        segs.push({ taskId: q.id, start: t, end: e });
        q.rem -= alloc;
        if (q.rem <= 0) pending--;
        t = e;
      }
      if (pending <= 0) break outer;
    }
  }
  const left = queue.filter(q => q.rem > 0).map(q => ({ id: q.id, rem: q.rem }));
  return { segs, left, end: segs.length ? segs[segs.length - 1].end : null };
}

function snapOf(st, taskId) {
  const t = st.tasks.find(x => x.id === taskId);
  return t ? { subjectId: t.subjectId, activity: t.activity, content: t.content } : null;
}

// Congela il piano fino a "now": ciò che è passato non si sposta più.
function freeze(st, now) {
  now = floorMin(now);
  if (st.cursor == null) { st.cursor = now; return true; }
  if (now <= st.cursor) return false;
  const { segs } = computePlan(st, st.cursor, { stopAt: now, cont: contTask(st) });
  for (const s of segs) {
    if (s.start >= now) break;
    const end = Math.min(s.end, now);
    const prev = st.frozen.find(f => f.taskId === s.taskId && f.end === s.start && f.st === 'planned');
    if (prev) prev.end = end;
    else st.frozen.push({ id: uid('f'), taskId: s.taskId, start: s.start, end, st: 'planned', snap: snapOf(st, s.taskId) });
  }
  st.cursor = now;
  return true;
}

// Un'attività i cui blocchi passati sono tutti confermati e senza residuo si chiude da sola.
function normalize(st) {
  const used = new Map(), allDone = new Map(), lastEnd = new Map();
  for (const f of st.frozen) {
    if (f.st === 'skipped') continue;
    used.set(f.taskId, (used.get(f.taskId) || 0) + (f.end - f.start) / MIN);
    if (f.st !== 'done') allDone.set(f.taskId, false);

    const last = lastByTask.get(p.taskId);

    it.activity = t ? t.activity : (it.snap ? it.snap.activity : 'Attività eliminata');

function layoutLanes(rects) {

    }

}

function dayDerived(wd) {
  const d = state.template[wd];
  const blocks = [...d.blocks].sort((a, b) => a.start - b.start || a.end - b.end);
  const overl = new Set();
  for (let i = 0; i < blocks.length; i++) for (let j = i + 1; j < blocks.length; j++)
    if (blocks[j].start < blocks[i].end && blocks[i].start < blocks[j].end) { overl.add(blocks[i].id); overl.add(blocks[j].id); }
  const free = freeOf({ start: d.start, end: d.end, blocks }).reduce((a, [x, y]) => a + y - x, 0);
  const R0 = 360, R1 = 1440, pct = m => ((Math.min(R1, Math.max(R0, m)) - R0) / (R1 - R0)) * 100;
  let bar = '';
  if (d.start > R0) bar += `<i class="off" style="left:0;width:${pct(d.start).toFixed(2)}%"></i>`;
  if (d.end < R1) bar += `<i class="off" style="left:${pct(d.end).toFixed(2)}%;right:0"></i>`;
  for (const b of blocks) bar += `<i class="bk tp-${b.type}" style="--c:${TYPES[b.type].color};left:${pct(b.start).toFixed(2)}%;width:${(pct(b.end) - pct(b.start)).toFixed(2)}%" title="${esc(b.label || TYPES[b.type].short)} ${fmtHM(b.start)}–${fmtHMend(b.end)}"></i>`;
  return { blocks, overl, free, bar };
}

function onTplChange(el) {

    if (!Number.isFinite(v)) { toast('Orario non valido: scrivi per esempio 9:30 o 2130', false); el.value = fmtHMend(f === 'bstart' ? b.start : b.end); return; }
    if (ne <= ns) { toast('La fine del blocco deve essere dopo l\'inizio', false); el.value = fmtHMend(f === 'bstart' ? b.start : b.end); return; }

function modal({ kick = '', color = '', title, sub = '', html = '', foot = '', wide = false }) {
  const d = document.createElement('dialog');
  d.className = `modal${wide ? ' wide' : ''}`;
  if (color) d.style.setProperty('--c', color);
  d.innerHTML = `<div class="m-wrap"><div class="m-head"><div>${kick ? `<span class="kick">${esc(kick)}</span>` : ''}<h2>${esc(title)}</h2>${sub ? `<p class="m-sub">${sub}</p>` : ''}</div><button type="button" class="icon-btn" data-close aria-label="Chiudi">${ICON.x}</button></div><div class="m-body">${html}</div>${foot ? `<div class="m-foot">${foot}</div>` : ''}</div>`;
  document.body.appendChild(d);
  d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
  d.addEventListener('close', () => d.remove());
  d.showModal();
  return d;
}
function sheet({ kick, color, title, sub, actions }) {
  const html = `<div class="actions">${actions.map((a, i) => a === '-' ? '<hr>' : `<button type="button" class="btn ${a.kind || ''}" data-i="${i}">${a.icon || ''}<span>${esc(a.label)}${a.hint ? `<span class="hint">${esc(a.hint)}</span>` : ''}</span></button>`).join('')}</div>`;
  const d = modal({ kick, color, title, sub, html });
  d.querySelector('.actions').addEventListener('click', e => {
    const b = e.target.closest('[data-i]');
    if (!b) return;
    d.close();
    actions[+b.dataset.i].fn();
  });
  const first = d.querySelector('.actions .btn');
  if (first) first.focus();
}
function confirmDialog({ title, body, ok, danger = false, fn }) {
  const d = modal({ title, html: `<p style="margin:0;color:var(--ink-2)">${body}</p>`, foot: `<button type="button" class="btn" data-close>Annulla</button><button type="button" class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(ok)}</button>` });
  d.querySelector('[data-ok]').addEventListener('click', () => { d.close(); fn(); });
}
function itemFromEl(el) { return findItem(buildModel(), el.dataset.task, el.dataset.start); }

function openItemSheet(taskId, start) {
  const M = buildModel();

  const t = it.task, ti = t ? M.tinfo.get(t.id) : null;

  const A = [];
  const add = (label, hint, fn, kind = '', icon = '') => A.push({ label, hint, fn, kind, icon });
  if (it.status === 'pending') {
    add('Svolto', 'Conferma questo blocco', () => setItemsStatus([it], 'done'), 'primary', ICON.check);
    add('Non svolto', 'Il tempo torna in coda e il resto slitta in avanti, da adesso', () => setItemsStatus([it], 'skipped'), '', ICON.x);
    if (t && t.status === 'todo' && ti && ti.rem > 0) add('Svolto, e attività finita', `Chiude l'attività e libera i ${fmtDur(ti.rem)} che restavano in programma`, () => completeTask(t.id), '', ICON.check);

    add('Non l\'ho ancora iniziata', 'Il pezzo già passato non conta: riparte da adesso con la durata piena', () => restartNow(it), '', ICON.play);
  } else if (it.status === 'future') {
    add('Salta questo blocco', `${cap(relDay(it.date))} dalle ${fmtTime(it.start)} alle ${fmtEnd(it.end, it.date)} non ci sei: la coda slitta in avanti`, () => addSkip(it.date, minOfDay(it.start), minWithin(it.end, it.date)), '', ICON.skip);
    add('Già completata', 'Chiude l\'attività adesso: le successive anticipano', () => completeTask(t.id), '', ICON.check);
    add('Mi serviranno altri 30 minuti', 'Allunga l\'attività', () => changeDuration(t.id, 30), '', ICON.plus);
    add('Falla per prima', 'Sposta l\'attività in cima alla coda', () => moveTask(t.id, 'top'), '', ICON.top);

  } else if (it.status === 'skipped') {

}

function freeClick(col, e) {
  const rect = col.getBoundingClientRect();
  const m = +col.dataset.vs + (e.clientY - rect.top) / +col.dataset.ppm;
  const start = Math.max(0, Math.min(1410, Math.floor(m / 30) * 30));
  const ds = col.dataset.date;
  if (tsOf(ds, start + 30) <= Date.now()) { toast('Il passato non si modifica: segna i blocchi passati come svolti o non svolti', false); return; }
  openExceptionEditor({ date: ds, start, end: Math.min(1440, start + 60), type: 'saltato', label: '', fromCalendar: true });
}

function setItemsStatus(items, st) {
  if (!items.length) return;
  const msg = { done: items.length > 1 ? `${items.length} blocchi segnati come svolti` : 'Segnato come svolto', skipped: 'Rimesso in coda: il resto slitta in avanti', planned: 'Torna da confermare' }[st];
  mutate(s => {
    for (const it of items) {
      for (const f of s.frozen) if (f.taskId === it.taskId && f.start < it.end && f.end > it.start) f.st = st;
      if (st === 'skipped') { const t = s.tasks.find(x => x.id === it.taskId); if (t && t.status === 'done') { t.status = 'todo'; t.completedAt = null; } }
    }
  }, msg);
}
function completeTask(id) {
  mutate(s => {
    const t = s.tasks.find(x => x.id === id);
    if (!t) return;
    t.status = 'done'; t.completedAt = Date.now();
    for (const f of s.frozen) if (f.taskId === id && f.st === 'planned') f.st = 'done';
  }, 'Attività completata');
}
function restartNow(it) {
  mutate(s => { for (const f of s.frozen) if (f.taskId === it.taskId && f.start < it.end && f.end > it.start && f.st === 'planned') f.st = 'skipped'; }, 'Riparte da adesso');

async function saveFile(filename, data) {
  if (downloadsApi) {
    try { await downloadsApi.save({ filename, data }); return 'saved'; }
    catch (err) {
      const c = err && err.code;
      if (c === 'declined') { toast('Salvataggio annullato', false); return 'declined'; }
      if (c === 'rate_limited') { toast('C\'è già una richiesta di salvataggio aperta', false); return 'busy'; }
    }
  }
  if (!inViewer && window.matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.share) {
    try {
      const type = /\.json$/.test(filename) ? 'application/json' : /\.csv$/.test(filename) ? 'text/csv' : 'application/octet-stream';
      const file = new File([data], filename, { type });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return 'saved'; }
    } catch (e) { if (e && e.name === 'AbortError') { toast('Salvataggio annullato', false); return 'declined'; } }
  }
  if (!inViewer) {
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], { type: 'application/octet-stream' }));
      a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      return 'saved';
    } catch (e) { /* fallback sotto */ }
  }
  showCopyBox(`Copia ${filename}`, data);
  return 'copy';
}

function importText(txt) {
  let ns;
  try { ns = sanitize(JSON.parse(txt)); } catch (e) { toast(`Backup non valido: ${e instanceof SyntaxError ? 'il testo non è JSON' : e.message}`, false); return; }
  const apply = () => mutate(s => {
    const lb = Math.max(+s.settings.lastBackup || 0, +ns.settings.lastBackup || 0) || undefined;
    for (const k of Object.keys(s)) delete s[k];
    Object.assign(s, ns); s.settings.lastBackup = lb; s.settings.introSeen = true;
    if (s.cursor == null) s.cursor = ceilQuarter(floorMin(Date.now()));
  }, `Importate ${ns.subjects.length} materie e ${ns.tasks.length} attività`);
  if (!state.subjects.length && !state.tasks.length) { apply(); return; }
  confirmDialog({ title: 'Sostituire i dati attuali?', ok: 'Importa',
    body: `Il backup contiene ${ns.subjects.length} materie e ${ns.tasks.length} attività. I dati attuali vengono sostituiti; subito dopo puoi ancora annullare.`,
    fn: apply });
}
function openPaste() {
  const d = modal({ title: 'Incolla un backup', html: '<textarea class="codebox" placeholder="Incolla qui il testo del backup (inizia con {&quot;v&quot;:1 …)"></textarea>',
    foot: '<button type="button" class="btn" data-close>Annulla</button><button type="button" class="btn primary" data-ok>Continua</button>' });
  const ta = d.querySelector('textarea');
  ta.focus();
  d.querySelector('[data-ok]').addEventListener('click', () => { const v = ta.value.trim(); d.close(); if (v) importText(v); });
}
const csvCell = v => { v = String(v ?? ''); return /[;"\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
const toCSV = rows => '\uFEFF' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');
async function exportPlanCSV() {
  const M = buildModel();
  const stl = { future: 'In programma', running: 'In corso', pending: 'Da confermare', done: 'Svolto', skipped: 'Non svolto' };
  const rows = [['Data', 'Giorno', 'Inizio', 'Fine', 'Minuti', 'Materia', 'Attività', 'Contenuto', 'Stato']];
  for (const it of M.items) rows.push([itDate(it.date), DAY_NAMES[weekday(it.date)], fmtTime(it.start), fmtEnd(it.end, it.date), Math.round((it.end - it.start) / MIN), it.subject ? it.subject.name : '', it.activity, it.content, stl[it.status]]);
  if ((await saveFile(`calendario-pacr-${todayStr()}.csv`, toCSV(rows))) === 'saved') toast('CSV del calendario salvato', false);
}
async function exportQueueCSV() {
  const M = buildModel();
  const rows = [['Ordine', 'Materia', 'Attività', 'Contenuto', 'Durata (min)', 'Già trascorsi (min)', 'Residui (min)', 'Stato', 'Quando', 'Non prima del', 'Note']];
  let n = 0;
  const order = [...state.tasks.filter(t => t.status === 'todo'), ...state.tasks.filter(t => t.status !== 'todo')];
  for (const t of order) {
    const s = M.subjById.get(t.subjectId), ti = M.tinfo.get(t.id);
    rows.push([t.status === 'todo' ? ++n : '', s ? s.name : '', t.activity, t.content, t.duration, Math.round(ti.used), ti.rem, taskState(t, M).label, t.status === 'todo' ? whenText(t, M) : '', t.notBefore ? itDate(t.notBefore) : '', t.note]);
  }
  if ((await saveFile(`coda-pacr-${todayStr()}.csv`, toCSV(rows))) === 'saved') toast('CSV della coda salvato', false);
}

// ---------- avvisi ----------
let toastTimer = null;
function toast(msg, withUndo) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${withUndo && undoStack.length ? '<button type="button" class="btn sm" data-act="undo">Annulla</button>' : ''}`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), withUndo ? 6000 : 3500);
}

// ---------- trascinamento nella coda ----------
function startDrag(e, grip) {
  const list = grip.closest('.queue'), row = grip.closest('.q-row');
  if (!list || !row) return;
  e.preventDefault();
  const rows = [...list.children], from = rows.indexOf(row), sy0 = window.scrollY;
  const rects = rows.map(r => { const b = r.getBoundingClientRect(); return { top: b.top + sy0, h: b.height }; });
  const gap = rects.length > 1 ? rects[1].top - (rects[0].top + rects[0].h) : 6;
  const step = rects[from].h + gap, startDocY = e.clientY + sy0;
  let to = from, lastY = e.clientY, raf = 0;
  dragging = true;
  row.classList.add('dragging'); list.classList.add('is-dragging');
  try { grip.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
  const update = () => {
    const dy = lastY + window.scrollY - startDocY;
    row.style.transform = `translateY(${dy}px)`;
    const cy = rects[from].top + rects[from].h / 2 + dy;
    let n = 0;
    rects.forEach((r, i) => { if (i !== from && cy > r.top + r.h / 2) n++; });
    to = n;
    rows.forEach((r, i) => {
      if (i === from) return;
      let sh = 0;
      if (from < to && i > from && i <= to) sh = -step;
      if (from > to && i >= to && i < from) sh = step;
      r.style.transform = sh ? `translateY(${sh}px)` : '';
    });
  };
  const edge = () => { // scorrimento automatico vicino ai bordi
    raf = 0;
    if (!dragging) return;
    const topEdge = ($('.topbar') ? $('.topbar').getBoundingClientRect().bottom : 0) + 60, botEdge = window.innerHeight - 60;
    const v = lastY < topEdge ? -Math.ceil((topEdge - lastY) / 5) : lastY > botEdge ? Math.ceil((lastY - botEdge) / 5) : 0;
    if (!v) return;
    const before = window.scrollY;
    window.scrollBy(0, v);
    if (window.scrollY !== before) { update(); raf = requestAnimationFrame(edge); }
  };
  const move = ev => { lastY = ev.clientY; update(); if (!raf) raf = requestAnimationFrame(edge); };
  const up = () => {
    grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
    if (raf) cancelAnimationFrame(raf);
    rows.forEach(r => { r.style.transform = ''; });
    row.classList.remove('dragging'); list.classList.remove('is-dragging');
    dragging = false;
    if (to === from) return;
    const old = rows.map(r => r.dataset.id), ids = [...old];
    ids.splice(from, 1); ids.splice(to, 0, old[from]);
    applyOrder(old, ids, 'Ordine aggiornato');
  };
  grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
}

// ---------- azioni ----------
const ACT = {
  tab: a => { ui.tab = a.dataset.tab; render(); window.scrollTo(0, 0); },
  undo: () => undo(),
  'intro-ok': () => { state.settings.introSeen = true; save(); render(); },
  'start-empty': () => { ui.tab = 'coda'; render(); window.scrollTo(0, 0); },
  install: async () => { const ev = installEvt; if (!ev) return; installEvt = null; try { await ev.prompt(); await ev.userChoice; } catch (e) { /* chiuso */ } render(); },
  'install-later': () => { try { localStorage.setItem('pacr-install-later', String(Date.now())); } catch (e) { /* ok */ } render(); },
  'week-prev': () => { ui.week = addDays(ui.week, -7); ui.day = addDays(ui.day, -7); render(); },
  'week-next': () => { ui.week = addDays(ui.week, 7); ui.day = addDays(ui.day, 7); render(); },
  today: () => { ui.week = mondayOf(todayStr()); ui.day = todayStr(); render(); },
  zoom: a => { state.settings.zoom = +a.dataset.z; save(); render(); },
  'pick-day': a => { ui.day = a.dataset.date; render(); },
  'open-item': a => openItemSheet(a.dataset.task, a.dataset.start),
  'item-done': a => { const it = itemFromEl(a); if (it) setItemsStatus([it], 'done'); },
  'item-skip': a => { const it = itemFromEl(a); if (it) setItemsStatus([it], 'skipped'); },
  'bulk-done': () => { const td = todayStr(); setItemsStatus(buildModel().items.filter(i => i.status === 'pending' && i.date < td), 'done'); },
  'bulk-skip': () => { const td = todayStr(); setItemsStatus(buildModel().items.filter(i => i.status === 'pending' && i.date < td), 'skipped'); },
  'task-complete': a => completeTask(a.dataset.task),
  'task-edit': a => openTaskEditor(a.dataset.task),
  'task-new': () => openTaskEditor(null),
  'task-up': a => moveTask(a.dataset.task, 'up'),
  'task-down': a => moveTask(a.dataset.task, 'down'),
  'task-reopen': a => mutate(s => { const t = s.tasks.find(x => x.id === a.dataset.task); if (t) { t.status = 'todo'; t.completedAt = null; } }, 'Attività riaperta'),
  'task-del': a => mutate(s => { s.tasks = s.tasks.filter(x => x.id !== a.dataset.task); s.frozen = s.frozen.filter(f => f.taskId !== a.dataset.task); }, 'Attività eliminata'),
  batch: () => openBatch(),
  'toggle-history': () => { ui.showHistory = !ui.showHistory; render(); },
  'subj-new': () => openSubjectEditor(null),
  'subj-edit': a => openSubjectEditor(a.dataset.id),
  'blk-add': a => addTplBlock(+a.dataset.wd),
  'blk-del': a => { const li = a.closest('li'); mutate(s => { const d = s.template[+li.dataset.wd]; d.blocks = d.blocks.filter(b => b.id !== li.dataset.id); }, 'Blocco eliminato'); },
  'day-copy': a => openCopyDay(+a.dataset.wd),
  'exc-new': () => openExceptionEditor({ date: todayStr(), start: 600, end: 660, type: 'altro' }),
  'exc-edit': a => openExceptionEditor({ id: a.dataset.id }),
  'exc-del': a => mutate(s => { s.exceptions = s.exceptions.filter(e => e.id !== a.dataset.id); }, 'Eccezione eliminata'),
  'dayoff-new': () => openDayOff(),
  'cancel-restore': a => mutate(s => { s.cancels = s.cancels.filter(c => !(c.date === a.dataset.date && c.blockId === a.dataset.id)); }, 'Impegno ripristinato'),
  'backup-save': () => doBackup(),
  'backup-copy': () => copyBackup(),
  'backup-paste': () => openPaste(),
  'csv-plan': () => exportPlanCSV(),
  'csv-queue': () => exportQueueCSV(),
  'reset-empty': () => confirmDialog({ title: 'Svuotare coda e storico?', ok: 'Svuota', danger: true, body: 'Restano materie e settimana tipo; spariscono attività, blocchi passati ed eccezioni. Subito dopo puoi ancora annullare.',
    fn: () => mutate(s => { s.tasks = []; s.frozen = []; s.exceptions = []; s.cancels = []; s.cursor = ceilQuarter(floorMin(Date.now())); }, 'Coda e storico svuotati') }),
};

function bindEvents() {
  document.addEventListener('click', e => {
    if (e.target.closest('dialog')) return;
    const a = e.target.closest('[data-act]');
    if (a) { const fn = ACT[a.dataset.act]; if (fn) { e.preventDefault(); fn(a, e); } return; }
    const itm = e.target.closest('.itm');
    if (itm) { openItemSheet(itm.dataset.task, itm.dataset.start); return; }
    const blk = e.target.closest('.blk');
    if (blk) { openBlockSheet(blk.dataset.date, blk.dataset.blk, blk.dataset.id); return; }
    const col = e.target.closest('.cal-col');
    if (col) freeClick(col, e);
  });
  document.addEventListener('pointerdown', e => {
    const g = e.target.closest('[data-drag]');
    if (g && e.button === 0) startDrag(e, g);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.closest('dialog')) return;
    if (el.closest('#view-impegni')) { onTplChange(el); return; }
    const c = el.dataset.change;
    if (c === 'filter') { ui.filter = el.value; render(); }
    else if (c === 'minchunk') mutate(s => { s.settings.minChunk = +el.value; }, `Blocco minimo: ${el.value} minuti`);
    else if (c === 'theme') { state.settings.theme = el.value; save(); render(); }
    else if (c === 'import-file') {
      const file = el.files && el.files[0];
      el.value = '';
      if (!file) return;
      const r = new FileReader();
      r.onload = () => importText(String(r.result));
      r.onerror = () => toast('Non riesco a leggere il file', false);
      r.readAsText(file);
    } else if (el.closest('#quick') && el.name === 'subjectId') ui.quick.subjectId = el.value;
  });
  document.addEventListener('submit', e => {
    if (e.target.id !== 'quick') return;
    e.preventDefault();
    const f = e.target, activity = f.activity.value.trim(), content = f.content.value.trim(), duration = Math.round(+f.duration.value), subjectId = f.subjectId.value;
    if (!activity) { toast('Indica l\'attività, per esempio Lettura', false); f.activity.focus(); return; }
    if (!(duration >= 5)) { toast('La durata deve essere di almeno 5 minuti', false); f.duration.focus(); return; }
    ui.quick = { subjectId, activity, duration };
    ui.focusQuick = true;
    mutate(s => { s.tasks.push({ id: uid('t'), subjectId, activity, content, duration, status: 'todo', notBefore: null, note: '', completedAt: null }); }, 'Aggiunta in coda');
  });
  document.addEventListener('keydown', e => {
    const inField = e.target.matches && e.target.matches('input, textarea, select');
    const dlg = document.querySelector('dialog[open]');
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !inField && !dlg) { e.preventDefault(); undo(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.itm, .blk')) { e.preventDefault(); e.target.click(); return; }
    if (e.target.matches && e.target.matches('.q-grip')) {
      const dir = { ArrowUp: 'up', ArrowDown: 'down', Home: 'top', End: 'bottom' }[e.key];
      if (dir) { e.preventDefault(); const id = e.target.closest('.q-row').dataset.id; ui.refocusGrip = id; moveTask(id, dir); }
      return;
    }
    if (ui.tab === 'piano' && !inField && !dlg && !e.ctrlKey && !e.metaKey && !e.altKey) {
      if (e.key === 'ArrowLeft') ACT['week-prev']();
      else if (e.key === 'ArrowRight') ACT['week-next']();
      else if (e.key === 't' || e.key === 'T') ACT.today();
    }
  });
  window.addEventListener('storage', e => {
    if (e.key !== LS_KEY || !e.newValue) return;
    try { state = sanitize(JSON.parse(e.newValue)); render(); } catch (err) { /* ignora */ }
  });
  const mq = window.matchMedia('(max-width: 760px)');
  if (mq.addEventListener) mq.addEventListener('change', () => render());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
}
function tick() {
  const before = state.cursor;
  freeze(state, Date.now());
  if (state.cursor !== before) save();
  if (dragging || document.querySelector('dialog[open]')) return;
  const ae = document.activeElement;
  if (ae && ae.matches && ae.matches('input, select, textarea')) { renderTopbar(buildModel()); return; }
  render();
}
function init() {
  $('#undo').innerHTML = ICON.undo;
  $('#acts').innerHTML = ACTIVITIES.map(a => `<option value="${esc(a)}"></option>`).join('');
  load();
  bindEvents();
  render();
  const tb = $('.topbar');
  const setH = () => document.documentElement.style.setProperty('--topbar-h', `${tb.offsetHeight}px`);
  setH();
  if (window.ResizeObserver) new ResizeObserver(setH).observe(tb);
  setInterval(tick, 30000);
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (ui.tab === 'piano' && !document.querySelector('dialog[open]')) render(); });
  window.addEventListener('appinstalled', () => { installEvt = null; render(); toast('App installata: la trovi tra le app del telefono', false); });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
init();

})();
